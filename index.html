<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💝</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa8d5 50%, #ff6b9d 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 80px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 3em;
            color: #ff1744;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .heart {
            font-size: 4em;
            margin-bottom: 20px;
            animation: beat 1.5s ease-in-out infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
        }

        .buttons {
            margin-top: 40px;
            display: flex;
            gap: 30px;
            justify-content: center;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff1744, #ff5252);
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 23, 68, 0.4);
        }

        #noBtn {
            background: linear-gradient(135deg, #757575, #9e9e9e);
            color: white;
            position: absolute;
            left: 200px;
        }

        #noBtn:hover {
            transform: scale(1.1);
        }

        /* Success screen when Yes is clicked */
        .success-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success-screen.show {
            display: block;
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
        }

        .success-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 1001;
        }

        .success-message h2 {
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.8);
            animation: bounceIn 1s ease;
        }

        .success-message p {
            font-size: 2em;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .hearts-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .floating-heart {
            position: absolute;
            font-size: 2em;
            animation: float 4s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Instructions */
        .instructions {
            margin-top: 30px;
            padding: 20px;
            background: #fff3cd;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
        }

        .instructions h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .instructions p {
            color: #856404;
            font-size: 0.9em;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- Main Question Screen -->
    <div class="container" id="questionScreen">
        <div class="heart">💝</div>
        <h1>Be My Valentine?</h1>
        <p style="font-size: 1.2em; color: #666; margin-bottom: 20px;">
            I have a very important question to ask you...
        </p>
        
        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">Yes! 💕</button>
            <button id="noBtn">No 😢</button>
        </div>

    </div>

    <!-- Success Screen (shown when Yes is clicked) -->
    <div class="success-screen" id="successScreen">
        <!-- Replace "your-image.jpg" with your actual image file name -->
        <img src="https://www.une.edu.au/__data/assets/image/0003/273486/Copy-of-Untitled-9.jpg" alt="Our Photo" class="background-image" id="backgroundImg">
        
        <div class="success-message">
            <h2>Yay! 💖</h2>
            <p>You made me the happiest person! 🥰</p>
        </div>

        <div class="hearts-animation" id="heartsContainer"></div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // Make the No button run away when mouse gets close
        noBtn.addEventListener('mouseover', function() {
            const randomX = Math.random() * (window.innerWidth - 200);
            const randomY = Math.random() * (window.innerHeight - 100);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        });

        // Handle Yes button click
        function sayYes() {
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('successScreen').classList.add('show');
            createFloatingHearts();
            
            // Check if image exists, if not show a helpful message
            const img = document.getElementById('backgroundImg');
            img.onerror = function() {
                this.style.display = 'none';
                document.querySelector('.success-screen').style.background = 
                    'linear-gradient(135deg, #ff6b9d 0%, #ffa8d5 50%, #ff6b9d 100%)';
                document.querySelector('.success-message').innerHTML += 
                    '<p style="font-size: 0.8em; margin-top: 20px;">💡 Add your image to see it here!</p>';
            };
        }

        // Create floating hearts animation
        function createFloatingHearts() {
            const heartsContainer = document.getElementById('heartsContainer');
            const heartSymbols = ['❤️', '💕', '💖', '💗', '💝', '💘'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                
                heartsContainer.appendChild(heart);
                
                // Remove heart after animation
                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }, 300);
        }
    </script>
</body>
</html>
